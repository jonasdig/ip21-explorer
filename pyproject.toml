[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ip21-explorer"
# Derived from the git history at build time (see [tool.setuptools_scm]).
# A fixed version would be the same on every commit, and pip skips a
# reinstall when the version has not changed - so "pip install --upgrade
# git+https://..." would quietly do nothing.
dynamic = ["version"]
description = "Fast trend viewer for IP21 process data"
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "numpy>=1.24",
    # The function library behind the formula catalog: Cognite's indsl
    # (Apache 2.0), with the extras its toolboxes need.
    "indsl[fluids,modeling,scikit,stats]>=8.9",
    # Calendar days for total() are local; Windows has no zone database of
    # its own for zoneinfo to read.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
aspen = ["tagreader>=5"]
dev = ["pytest", "httpx", "tagreader>=6"]

[project.scripts]
ip21-explorer = "ip21_explorer.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ip21_explorer = ["static/*", "static/vendor/*"]

[tool.setuptools_scm]
# A build with no .git to read - a downloaded zip - has no history to count.
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # indsl's own defaults, e.g. pd.Timedelta("3d"), which pandas 4 will want
    # spelled "3D". Nothing we can fix from here.
    "ignore::pandas.errors.Pandas4Warning",
]
